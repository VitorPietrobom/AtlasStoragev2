plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.atlascutout'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.atlascutout"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // ML Kit subject segmentation (Google Play services; the model downloads on first use).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
